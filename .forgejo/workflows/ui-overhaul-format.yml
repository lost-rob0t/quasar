name: UI overhaul formatter

on:
  push:
    branches:
      - ui-core-shell-overhaul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'forgejo-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-core-shell-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend run format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- frontend; then
            exit 0
          fi
          git config user.name forgejo-actions[bot]
          git config user.email forgejo-actions[bot]@noreply.git.starintel.actor
          git add frontend docs
          git commit -m "Format UI overhaul"
          git push origin HEAD:ui-core-shell-overhaul
