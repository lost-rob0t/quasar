[unix_http_server]
file=/opt/quasar-aio/state/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/opt/quasar-aio/state/logs/supervisord.log
pidfile=/opt/quasar-aio/state/supervisord.pid
childlogdir=/opt/quasar-aio/state/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/quasar-aio/state/supervisor.sock

[program:couchdb]
command=/opt/quasar-aio/runtime/services/run-couchdb.sh
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/quasar-aio/state/logs/couchdb.log
redirect_stderr=true

[program:valkey]
command=/opt/quasar-aio/runtime/services/run-valkey.sh
priority=15
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/quasar-aio/state/logs/valkey.log
redirect_stderr=true

[program:rabbitmq]
command=/opt/quasar-aio/runtime/services/run-rabbitmq.sh
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/quasar-aio/state/logs/rabbitmq.log
redirect_stderr=true

[program:star-server]
command=/opt/quasar-aio/runtime/services/run-star-server.sh
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/quasar-aio/state/logs/star-server.log
redirect_stderr=true

[program:quasar]
command=/opt/quasar-aio/runtime/services/run-quasar.sh
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/quasar-aio/state/logs/quasar.log
redirect_stderr=true
