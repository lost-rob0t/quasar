name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:static
      - run: npm test
      - run: npm run build
        env:
          VITE_E2E: "true"
      - name: Validate application artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -q "Quasar" dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
