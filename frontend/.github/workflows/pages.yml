name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          # The configured Pages custom domain serves this project at its origin root.
          VITE_BASE_PATH: /
      - name: Validate Pages base path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/assets/' dist/index.html
          grep -q 'href="/manifest.webmanifest"' dist/index.html
          if grep -q '/${{ github.event.repository.name }}/' dist/index.html; then
            echo "Pages artifact still contains the repository project path" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
