name: Pro actors PR gate

on:
  pull_request:
    paths:
      - "control-plane/src/pro-actors.lisp"
      - "control-plane/src/main.lisp"
      - "control-plane/tests/pro-actor-tests.lisp"
      - "systems/quasar-control.asd"
      - "systems/quasar-tests.asd"
      - "frontend/src/components/ActorHub.jsx"
      - "frontend/src/components/ProActorManager.jsx"
      - "frontend/src/control-plane/mutations.ts"
      - "frontend/src/lib/pro-actors.js"
      - "frontend/src/lib/pro-actors.test.js"
      - "frontend/src/App.jsx"
      - ".github/workflows/pro-actors-pr.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format touched frontend files deterministically
        run: |
          cd frontend
          npx prettier --write \
            src/components/ProActorManager.jsx \
            src/control-plane/mutations.ts \
            src/lib/pro-actors.js \
            src/lib/pro-actors.test.js
      - name: Upload formatter output
        uses: actions/upload-artifact@v4
        with:
          name: pro-actor-prettier
          path: |
            frontend/src/components/ProActorManager.jsx
            frontend/src/control-plane/mutations.ts
            frontend/src/lib/pro-actors.js
            frontend/src/lib/pro-actors.test.js
      - name: Require committed formatter output
        run: git diff --exit-code -- frontend/src
      - name: Frontend static checks
        run: npm --prefix frontend run check
      - name: Pro actor unit tests
        run: |
          cd frontend
          npx vitest run src/lib/pro-actors.test.js
      - name: Production frontend build
        run: npm run build

  common-lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Common Lisp runtime dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet \
            sbcl curl git libffi-dev libssl-dev libsqlite3-dev librabbitmq-dev liblmdb-dev
          curl --fail --silent --show-error --output /tmp/quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"/home/runner/quicklisp/")'
          printf '%s\n' '(load #p"/home/runner/quicklisp/setup.lisp")' > /home/runner/.sbclrc
          bash scripts/bootstrap-lisp-deps
      - name: Load Quasar web system
        run: LOAD_ONLY=1 bash scripts/run-control-plane
      - name: Control-plane test suite
        run: npm run test:lisp
