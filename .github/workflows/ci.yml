name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test ! -e .gitmodules
          test ! -e frontend-overlay
          test ! -e scripts/prepare-frontend.sh
          test -f frontend/package.json
          test -f frontend/src/app/main.tsx
          test -f frontend/src/control-plane/client.ts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies from the root lockfile
        run: npm ci

      - name: Format, lint, type, boundary, and static checks
        run: npm run check

      - name: Frontend unit and integration tests
        run: |
          npm --prefix frontend run test:unit
          npm --prefix frontend run test:integration

      - name: Production frontend build
        run: npm run build

      - name: Install Common Lisp runtime dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet \
            sbcl curl git libffi-dev libssl-dev libsqlite3-dev librabbitmq-dev
          curl --fail --silent --show-error --output /tmp/quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"/home/runner/quicklisp/")'
          printf '%s\n' '(load #p"/home/runner/quicklisp/setup.lisp")' > /home/runner/.sbclrc
          git clone --quiet https://github.com/rabbibotton/clog.git \
            /home/runner/quicklisp/local-projects/clog
          git -C /home/runner/quicklisp/local-projects/clog checkout --quiet \
            9ee022a97ab4109f2ff6d2b9c43ba6da286d6302

      - name: Common Lisp transaction, persistence, and control-plane tests
        run: npm run test:lisp

      - name: Load the real quasar-web system
        run: |
          output=$(mktemp)
          sbcl --non-interactive \
            --eval '(setf asdf:*central-registry* nil)' \
            --eval '(asdf:clear-configuration)' \
            --eval '(ql:quickload (list :jsown :sento :bordeaux-threads :clog :websocket-driver) :silent t)' \
            --eval '(asdf:load-asd (truename "systems/quasar-control.asd"))' \
            --eval '(asdf:load-asd (truename "systems/quasar-starlang.asd"))' \
            --eval '(asdf:load-asd (truename "systems/quasar-web.asd"))' \
            --eval '(asdf:load-system :quasar-web)' 2>&1 | tee "$output"
          if grep -iE '(undefined.*function|UNDEFINED-FUNCTION|; caught.*ERROR.*condition)' "$output"; then
            echo "quasar-web produced a compilation error or undefined function" >&2
            exit 1
          fi

      - name: Complete development stack smoke test
        run: npm run smoke

      - name: Install tracked Playwright browser runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Real-stack desktop, mobile, mutation, and reload paths
        run: npm run test:e2e

      - name: Packaged production build, serve, routing, PWA, and security smoke
        run: npm run smoke:production
