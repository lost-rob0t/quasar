name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test ! -e .gitmodules
          test ! -e frontend-overlay
          test ! -e scripts/prepare-frontend.sh
          test -f frontend/package.json
          test -f frontend/src/app/main.tsx
          test -f frontend/src/control-plane/client.ts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies from the root lockfile
        run: npm ci

      - name: Format, lint, type, boundary, and static checks
        run: npm run check

      - name: Frontend unit and integration tests
        # Invoke vitest directly: `npm run -- --flag` drops forwarded args
        # under --prefix, so the Forgejo CPU-starved runner kept hitting the
        # 5s default testTimeout. 60s ceiling; real hangs still fail.
        run: |
          cd frontend
          npx vitest run src tests/unit --testTimeout 60000
          npx vitest run tests/integration --testTimeout 60000

      - name: Production frontend build
        run: npm run build

      - name: Install Common Lisp runtime dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet \
            sbcl curl git libffi-dev libssl-dev libsqlite3-dev librabbitmq-dev liblmdb-dev
          curl --fail --silent --show-error --output /tmp/quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval "(quicklisp-quickstart:install :path #p\"$HOME/quicklisp/\")"
          printf '%s\n' "(load #p\"$HOME/quicklisp/setup.lisp\")" > "$HOME/.sbclrc"
          bash scripts/bootstrap-lisp-deps

      - name: Verify native runtime libraries are load-path visible
        run: node scripts/check-native-runtime.mjs

      - name: Common Lisp transaction, persistence, and control-plane tests
        run: npm run test:lisp

      - name: Load the real quasar-web system
        run: |
          output=$(mktemp)
          LOAD_ONLY=1 bash scripts/run-control-plane 2>&1 | tee "$output"
          if grep -iE '(undefined.*function|UNDEFINED-FUNCTION|; caught.*ERROR.*condition)' "$output"; then
            echo "quasar-web produced a compilation error or undefined function" >&2
            exit 1
          fi

      - name: Complete Ubuntu development stack smoke test
        run: npm run smoke

      - name: Install tracked Playwright browser runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Real-stack desktop, mobile, mutation, reload, and route-density paths
        id: e2e
        run: npm run test:e2e -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PR_VISUAL_EVIDENCE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PR_SCREENSHOT_DIR: pr-screenshots

      - name: Verify PR screenshot completeness
        id: visual-evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          expected=20
          actual=$(find frontend/pr-screenshots -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$actual" >> "$GITHUB_OUTPUT"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Expected $expected PR route screenshots, found $actual"
            exit 1
          fi

      - name: Upload PR route screenshots
        id: pr-screenshots
        # Artifact v2 API is unavailable on Forgejo; tolerate upload failure there.
        continue-on-error: true
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: quasar-pr-${{ github.event.pull_request.number }}-screenshots-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: frontend/pr-screenshots/

      - name: Publish PR visual evidence
        # Plain REST instead of actions/github-script (not mirrored on
        # data.forgejo.org). Uses GET/DELETE/POST routes that are identical on
        # GitHub and Forgejo; the update-comment route differs between hosts.
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          EVIDENCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_API_URL: ${{ github.api_url }}
          EVIDENCE_REPO: ${{ github.repository }}
          EVIDENCE_PR: ${{ github.event.pull_request.number }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_URL: ${{ steps.pr-screenshots.outputs.artifact-url }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.visual-evidence.outcome }}
          SCREENSHOT_COUNT: ${{ steps.visual-evidence.outputs.count }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to publish PR visual evidence" >&2; exit 1; }
          marker='<!-- quasar-pr-visual-evidence -->'
          artifact_url="${ARTIFACT_URL:-}"
          outcome="${E2E_OUTCOME:-unknown}"
          evidence_outcome="${EVIDENCE_OUTCOME:-unknown}"
          screenshot_count="${SCREENSHOT_COUNT:-0}"
          api="${EVIDENCE_API_URL}/repos/${EVIDENCE_REPO}/issues/${EVIDENCE_PR}/comments"
          auth=(-H "Authorization: token ${EVIDENCE_TOKEN}")

          routes=('/' '/graph' '/datasets' '/documents' '/documents/new' '/agents' '/actors' '/code' '/import' '/settings')
          route_lines=""
          for route in "${routes[@]}"; do
            route_lines+="- \`${route}\` — desktop + mobile"$'\n'
          done

          if [ "$evidence_outcome" = "success" ] && [ "$screenshot_count" -eq 20 ] && [ -n "$artifact_url" ]; then
            icon='✅'
            evidence="CI verified and captured **20 deterministic screenshots**: every primary Quasar route on both **1440×900 desktop** and **390×844 mobile**. This deliberately screenshots the full primary-route surface, which is a superset of pages touched by the PR, so shared shell/style changes cannot hide outside the directly edited component.

          ${route_lines}
          **[Open screenshot artifact](${artifact_url})**"
          else
            icon='⚠️'
            evidence="Visual evidence is incomplete for this head: CI verified **${screenshot_count}/20** required route screenshots. The PR does not claim complete screenshot coverage until all 20 files exist and the Playwright route matrix passes."
            if [ -n "$artifact_url" ]; then
              evidence="${evidence}

          **[Open partial screenshot artifact](${artifact_url})**"
            fi
          fi

          body="$(printf '%s
          ## %s Playwright UI evidence

          **Exact head:** `%s`
          **E2E outcome:** `%s`
          **Screenshot gate:** `%s` (%s/20)

          %s

          The Playwright gate adds **28 targeted coverage cases** on top of the existing real-stack suite: 20 route/device contracts, one static-route coverage guard, and seven Code Studio/Actor Studio behavior tests. Failed tests retain trace, screenshot, and video diagnostics.
          ' "$marker" "$icon" "$EVIDENCE_HEAD_SHA" "$outcome" "$evidence_outcome" "$screenshot_count" "$evidence")"

          existing_id=$(curl -fsS "${auth[@]}" "${api}?per_page=100&limit=100" \
            | jq -r --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))][0].id // empty')
          if [ -n "$existing_id" ]; then
            curl -fsS -X DELETE "${auth[@]}" "${EVIDENCE_API_URL}/repos/${EVIDENCE_REPO}/issues/comments/${existing_id}" >/dev/null
          fi

          printf '%s' "$body" | jq -Rs '{body: .}' \
            | curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' -d @- "${api}" >/dev/null
          echo "Published PR visual evidence comment (replaced comment id: ${existing_id:-none})"

      - name: Upload Playwright failure diagnostics
        # Artifact v2 API is unavailable on Forgejo; tolerate upload failure there.
        continue-on-error: true
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/pr-screenshots/

      - name: Packaged production build, serve, routing, PWA, and security smoke
        run: npm run smoke:production

  nix-runtime:
    name: Fresh Nix runtime + real startup
    # Authoritative on GitHub only: building the SBCL closure needs more RAM
    # than the Forgejo runner host can afford (the build was SIGKILLed there,
    # exit 137). Skipped jobs do not fail Forgejo CI.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        # DeterminateSystems/nix-installer-action is not mirrored on
        # data.forgejo.org, so install the same tool via its official script.
        # /run/systemd/system exists exactly when systemd is PID 1: GitHub
        # hosted runners (multi-user install under sudo, service-managed
        # daemon) vs Forgejo act containers (root install, installer-managed
        # daemon). systemctl is-system-running is NOT a reliable
        # discriminator: GitHub images often report "degraded" (exit 1).
        run: |
          set -euo pipefail
          systemd_dir="${QUASAR_SYSTEMD_RUNTIME_DIR:-/run/systemd/system}"
          if [ -d "$systemd_dir" ]; then
            init_args=(--init systemd)
            install_cmd=(sudo sh -s --)
          else
            init_args=(--init none)
            install_cmd=(sh -s --)
          fi
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix |
            "${install_cmd[@]}" install linux --no-confirm "${init_args[@]}"
          {
            echo "$HOME/.nix-profile/bin"
            echo "/nix/var/nix/profiles/default/bin"
          } >> "$GITHUB_PATH"

      - name: Build saved Quasar runtime and pinned authentication bridge
        run: nix build .#checks.x86_64-linux.quasar-server --no-write-lock-file --print-build-logs

      - name: Bootstrap and smoke test inside the repository flake
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            npm ci
            curl --fail --silent --show-error --output /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path #p\"$HOME/quicklisp/\")"
            printf "%s\n" "(load #p\"$HOME/quicklisp/setup.lisp\")" > "$HOME/.sbclrc"
            bash scripts/bootstrap-lisp-deps
            node scripts/check-native-runtime.mjs
            LOAD_ONLY=1 bash scripts/run-control-plane
            env -u QUASAR_DEV_NIX_READY -u LD_LIBRARY_PATH IN_NIX_SHELL=impure npm run smoke
          '
