name: CI

on:
  push:
    branches:
      - gpu-graph-renderer
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test ! -e .gitmodules
          test ! -e frontend-overlay
          test ! -e scripts/prepare-frontend.sh
          test -f frontend/package.json
          test -f frontend/src/app/main.tsx
          test -f frontend/src/control-plane/client.ts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies from the root lockfile
        run: npm ci

      - name: Format, lint, type, boundary, and static checks
        run: npm run check

      - name: Frontend unit and integration tests
        run: |
          npm --prefix frontend run test:unit
          npm --prefix frontend run test:integration

      - name: Production frontend build
        run: npm run build

      - name: Install Common Lisp runtime dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet \
            sbcl curl git libffi-dev libssl-dev libsqlite3-dev librabbitmq-dev liblmdb-dev
          curl --fail --silent --show-error --output /tmp/quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"/home/runner/quicklisp/")'
          printf '%s\n' '(load #p"/home/runner/quicklisp/setup.lisp")' > /home/runner/.sbclrc
          bash scripts/bootstrap-lisp-deps

      - name: Verify native runtime libraries are load-path visible
        run: node scripts/check-native-runtime.mjs

      - name: Common Lisp transaction, persistence, and control-plane tests
        run: npm run test:lisp

      - name: Load the real quasar-web system
        run: |
          output=$(mktemp)
          LOAD_ONLY=1 bash scripts/run-control-plane 2>&1 | tee "$output"
          if grep -iE '(undefined.*function|UNDEFINED-FUNCTION|; caught.*ERROR.*condition)' "$output"; then
            echo "quasar-web produced a compilation error or undefined function" >&2
            exit 1
          fi

      - name: Complete Ubuntu development stack smoke test
        run: npm run smoke

      - name: Install tracked Playwright browser runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Benchmark branch Canvas/WebGL against current main Canvas
        env:
          QUASAR_GRAPH_BENCH_SIZES: "100,250,500,750,1000,1500,2000,3000,4000,6000,8000,12000,16000,24000,32000,50000"
          QUASAR_GRAPH_BENCH_FRAMES: "8"
        run: |
          set -euo pipefail

          export QUASAR_GRAPH_BENCH_JSON=/tmp/quasar-branch.json
          npm run benchmark:graph-renderer

          git fetch --depth=1 origin main
          git worktree add --detach /tmp/quasar-main FETCH_HEAD
          cp frontend/src/graph/renderer-benchmark.js /tmp/quasar-main/frontend/src/graph/renderer-benchmark.js
          cp frontend/benchmarks/graph-renderer.html /tmp/quasar-main/frontend/benchmarks/graph-renderer.html
          cp frontend/scripts/benchmark-graph-renderer.mjs /tmp/quasar-main/frontend/scripts/benchmark-graph-renderer.mjs
          sed -i 's/{ sizes: benchmarkSizes, motionFrames: frames }/{ sizes: benchmarkSizes, motionFrames: frames, backends: ["canvas"] }/' /tmp/quasar-main/frontend/scripts/benchmark-graph-renderer.mjs

          (
            cd /tmp/quasar-main
            npm ci
            QUASAR_GRAPH_BENCH_JSON=/tmp/quasar-main.json \
            QUASAR_GRAPH_BENCH_SIZES="$QUASAR_GRAPH_BENCH_SIZES" \
            QUASAR_GRAPH_BENCH_FRAMES="$QUASAR_GRAPH_BENCH_FRAMES" \
            node frontend/scripts/benchmark-graph-renderer.mjs
          )

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const main = JSON.parse(fs.readFileSync('/tmp/quasar-main.json', 'utf8'));
          const branch = JSON.parse(fs.readFileSync('/tmp/quasar-branch.json', 'utf8'));
          const rows = new Map();
          for (const row of main.rows) {
            if (row.requestedBackend === 'canvas' && !row.error) {
              rows.set(row.nodes, { nodes: row.nodes, main: row });
            }
          }
          for (const row of branch.rows) {
            if (row.error || row.rendererFallback) continue;
            const out = rows.get(row.nodes) || { nodes: row.nodes };
            if (row.requestedBackend === 'canvas') out.branchCanvas = row;
            if (row.requestedBackend === 'webgl') out.branchWebgl = row;
            rows.set(row.nodes, out);
          }
          const n = v => Number.isFinite(v) ? Number(v.toFixed(2)) : null;
          const result = [...rows.values()].sort((a,b) => a.nodes-b.nodes).map(r => ({
            nodes: r.nodes,
            mainFirstMs: n(r.main?.firstFrameMs),
            mainPanFps: n(r.main?.panFps),
            mainZoomFps: n(r.main?.zoomFps),
            mainMutationMs: n(r.main?.mutationMs),
            webglFirstMs: n(r.branchWebgl?.firstFrameMs),
            webglPanFps: n(r.branchWebgl?.panFps),
            webglZoomFps: n(r.branchWebgl?.zoomFps),
            webglMutationMs: n(r.branchWebgl?.mutationMs),
            firstSpeedup: r.main && r.branchWebgl ? n(r.main.firstFrameMs / r.branchWebgl.firstFrameMs) : null,
            panSpeedup: r.main && r.branchWebgl ? n(r.branchWebgl.panFps / r.main.panFps) : null,
            zoomSpeedup: r.main && r.branchWebgl ? n(r.branchWebgl.zoomFps / r.main.zoomFps) : null,
            mutationSpeedup: r.main && r.branchWebgl ? n(r.main.mutationMs / r.branchWebgl.mutationMs) : null
          }));
          console.log('QUASAR_BENCH_COMPARE_JSON=' + JSON.stringify(result));
          console.log('QUASAR_BENCH_GPU_JSON=' + JSON.stringify(branch.gpu));
          NODE

      - name: Real-stack desktop, mobile, mutation, and reload paths
        run: npm run test:e2e -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/

      - name: Packaged production build, serve, routing, PWA, and security smoke
        run: npm run smoke:production

  nix-runtime:
    name: Fresh Nix runtime + real startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Bootstrap and smoke test inside the repository flake
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            npm ci
            curl --fail --silent --show-error --output /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path #p\"$HOME/quicklisp/\")"
            printf "%s\n" "(load #p\"$HOME/quicklisp/setup.lisp\")" > "$HOME/.sbclrc"
            bash scripts/bootstrap-lisp-deps
            node scripts/check-native-runtime.mjs
            LOAD_ONLY=1 bash scripts/run-control-plane
            env -u QUASAR_DEV_NIX_READY -u LD_LIBRARY_PATH IN_NIX_SHELL=impure npm run smoke
          '
