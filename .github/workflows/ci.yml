name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test ! -e .gitmodules
          test ! -e frontend-overlay
          test ! -e scripts/prepare-frontend.sh
          test -f frontend/package.json
          test -f frontend/src/app/main.tsx
          test -f frontend/src/control-plane/client.ts

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies from the root lockfile
        run: npm ci

      - name: Format, lint, type, boundary, and static checks
        run: npm run check

      - name: Frontend unit and integration tests
        run: |
          npm --prefix frontend run test:unit
          npm --prefix frontend run test:integration

      - name: Production frontend build
        run: npm run build

      - name: Install Common Lisp runtime dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet \
            sbcl curl git libffi-dev libssl-dev libsqlite3-dev librabbitmq-dev liblmdb-dev
          curl --fail --silent --show-error --output /tmp/quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"/home/runner/quicklisp/")'
          printf '%s\n' '(load #p"/home/runner/quicklisp/setup.lisp")' > /home/runner/.sbclrc
          bash scripts/bootstrap-lisp-deps

      - name: Verify native runtime libraries are load-path visible
        run: node scripts/check-native-runtime.mjs

      - name: Common Lisp transaction, persistence, and control-plane tests
        run: npm run test:lisp

      - name: Load the real quasar-web system
        run: |
          output=$(mktemp)
          LOAD_ONLY=1 bash scripts/run-control-plane 2>&1 | tee "$output"
          if grep -iE '(undefined.*function|UNDEFINED-FUNCTION|; caught.*ERROR.*condition)' "$output"; then
            echo "quasar-web produced a compilation error or undefined function" >&2
            exit 1
          fi

      - name: Complete Ubuntu development stack smoke test
        run: npm run smoke

      - name: Install tracked Playwright browser runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Real-stack desktop, mobile, mutation, reload, and route-density paths
        id: e2e
        run: npm run test:e2e -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PR_VISUAL_EVIDENCE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PR_SCREENSHOT_DIR: pr-screenshots

      - name: Upload PR route screenshots
        id: pr-screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: quasar-pr-${{ github.event.pull_request.number }}-screenshots-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: frontend/pr-screenshots/

      - name: Publish PR visual evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.pr-screenshots.outputs.artifact-url }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const marker = '<!-- quasar-pr-visual-evidence -->';
            const artifactUrl = process.env.ARTIFACT_URL || '';
            const outcome = process.env.E2E_OUTCOME || 'unknown';
            const captured = Boolean(artifactUrl);
            const icon = outcome === 'success' && captured ? '✅' : '⚠️';
            const routes = ['/', '/graph', '/datasets', '/documents', '/documents/new', '/agents', '/actors', '/code', '/import', '/settings'];
            const evidence = captured
              ? `CI captured **20 deterministic screenshots**: every primary Quasar route on both **1440×900 desktop** and **390×844 mobile**. This deliberately screenshots the full primary-route surface, which is a superset of pages touched by the PR, so shared shell/style changes cannot hide outside the directly edited component.\n\n${routes.map((route) => `- \`${route}\` — desktop + mobile`).join('\n')}\n\n**[Open screenshot artifact](${artifactUrl})**`
              : 'Screenshot capture did not run to completion because an earlier CI gate prevented the Playwright route matrix from completing. No screenshot artifact is being claimed for this head.';
            const body = `${marker}
            ## ${icon} Playwright UI evidence

            **Exact head:** \`${context.sha}\`  
            **E2E outcome:** \`${outcome}\`

            ${evidence}

            The same Playwright gate runs the existing real-stack mutation/reload suite plus dedicated Code Studio/Actor Studio validation tests. Failed tests retain trace, screenshot, and video diagnostics.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/pr-screenshots/

      - name: Packaged production build, serve, routing, PWA, and security smoke
        run: npm run smoke:production

  nix-runtime:
    name: Fresh Nix runtime + real startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Bootstrap and smoke test inside the repository flake
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            npm ci
            curl --fail --silent --show-error --output /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path #p\"$HOME/quicklisp/\")"
            printf "%s\n" "(load #p\"$HOME/quicklisp/setup.lisp\")" > "$HOME/.sbclrc"
            bash scripts/bootstrap-lisp-deps
            node scripts/check-native-runtime.mjs
            LOAD_ONLY=1 bash scripts/run-control-plane
            env -u QUASAR_DEV_NIX_READY -u LD_LIBRARY_PATH IN_NIX_SHELL=impure npm run smoke
          '
