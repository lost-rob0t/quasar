name: Report parent tree

on:
  push:
    branches:
      - agent/monorepo-ui-control-plane

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: tree
        shell: bash
        run: echo "sha=$(git rev-parse HEAD^1^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          TREE_SHA: ${{ steps.tree.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: `merge-resolution-parent-tree: ${process.env.TREE_SHA}`
            });
